name: Retroactive Build APK for Releases

on:
  workflow_dispatch:
    inputs:
      specific_tag:
        description: 'Tag cụ thể để build (để trống = build tất cả release chưa có APK)'
        required: false
        default: ''

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.find-releases.outputs.releases }}
      has_releases: ${{ steps.find-releases.outputs.has_releases }}
    steps:
      - name: Find releases without APK
        id: find-releases
        uses: actions/github-script@v7
        with:
          script: |
            const specificTag = '${{ github.event.inputs.specific_tag }}';
            let releasesToBuild = [];

            if (specificTag) {
              try {
                const release = await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag: specificTag
                });
                const hasApk = release.data.assets.some(a => a.name.endsWith('.apk'));
                if (hasApk) {
                  console.log(`Release ${specificTag} already has APK, skipping.`);
                  core.setOutput('has_releases', 'false');
                  core.setOutput('releases', '[]');
                  return;
                }
                releasesToBuild.push({
                  tag: specificTag,
                  id: release.data.id,
                  name: release.data.name || specificTag
                });
              } catch (e) {
                console.log(`Release for tag ${specificTag} not found: ${e.message}`);
                core.setOutput('has_releases', 'false');
                core.setOutput('releases', '[]');
                return;
              }
            } else {
              const releases = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });

              for (const release of releases.data) {
                const hasApk = release.assets.some(a => a.name.endsWith('.apk'));
                if (!hasApk) {
                  releasesToBuild.push({
                    tag: release.tag_name,
                    id: release.id,
                    name: release.name || release.tag_name
                  });
                }
              }
            }

            console.log(`Found ${releasesToBuild.length} releases to build: ${JSON.stringify(releasesToBuild)}`);
            core.setOutput('has_releases', releasesToBuild.length > 0 ? 'true' : 'false');
            core.setOutput('releases', JSON.stringify(releasesToBuild));

  build:
    needs: prepare
    if: needs.prepare.outputs.has_releases == 'true'
    strategy:
      matrix:
        release: ${{ fromJson(needs.prepare.outputs.releases) }}
      fail-fast: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code at tag ${{ matrix.release.tag }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.release.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "build-tools;34.0.0" "platforms;android-34" > /dev/null 2>&1 || true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Fix build issues for old tags
        run: |
          # Remove allprojects block if it exists (conflicts with settings.gradle FAIL_ON_PROJECT_REPOS)
          sed -i '/^allprojects {/,/^}/d' build.gradle

          # Ensure gradlew exists
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, creating wrapper..."
            # Download gradle wrapper files from main branch
            cd /tmp
            git clone --depth 1 https://github.com/${{ github.repository }}.git main_repo 2>/dev/null || true
            if [ -f "/tmp/main_repo/gradlew" ]; then
              cp /tmp/main_repo/gradlew /tmp/main_repo/gradlew.bat .
              cp -r /tmp/main_repo/gradle/wrapper/. gradle/wrapper/.
            fi
            rm -rf /tmp/main_repo
          fi
          chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APK with apksigner
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*-unsigned.apk" -o -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"

          # Zipalign
          ALIGNED_PATH="app/build/outputs/apk/release/aligned.apk"
          ${ANDROID_HOME}/build-tools/34.0.0/zipalign -v 4 "$APK_PATH" "$ALIGNED_PATH" || cp "$APK_PATH" "$ALIGNED_PATH"

          # Sign with apksigner
          SIGNED_PATH="app/build/outputs/apk/release/SaMacAoGiac-signed.apk"
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner sign \
            --ks app/release.keystore \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out "$SIGNED_PATH" \
            "$ALIGNED_PATH"

          # Verify
          ${ANDROID_HOME}/build-tools/34.0.0/apksigner verify --print-certs "$SIGNED_PATH"
          echo "APK signed successfully: $SIGNED_PATH"

      - name: Prepare release output
        run: |
          mkdir -p release_output
          TAG_NAME="${{ matrix.release.tag }}"
          cp "app/build/outputs/apk/release/SaMacAoGiac-signed.apk" "release_output/SaMacAoGiac-${TAG_NAME}.apk"
          echo "APK prepared: SaMacAoGiac-${TAG_NAME}.apk"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.release.tag }}
          files: release_output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
