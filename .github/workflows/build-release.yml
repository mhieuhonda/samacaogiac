name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "build-tools;34.0.0" "platforms;android-34" > /dev/null 2>&1 || true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Create Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.4

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare release output
        run: |
          mkdir -p release_output
          APK_PATH=$(find app/build/outputs -name "*.apk" -type f | head -1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" release_output/SaMacAoGiac-debug.apk
            echo "APK built successfully: $APK_PATH"
          else
            echo "No APK found - build may have failed"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Sa Mạc Ảo Giác ${{ github.ref_name }}"
          body: |
            ## 🏜️ Sa Mạc Ảo Giác — Desert Mirage

            Game đua xe sa mạc góc nhìn thứ ba cho Android!

            ### 🎮 Cách cài đặt:
            1. Download file APK bên dưới
            2. Mở file trên điện thoại Android 7.0+
            3. Cài đặt và chơi!

            ### 🎭 v0.2 Highlights:
            - 🐛 Fix 8 bugs from v0.1
            - 🎭 Troll features: control reversal, car color change, fake notifications
            - 🏆 Sarcastic achievement milestones
            - 🎯 Real fork road geometry + dead-end barrier
            - 💀 Obstacle collision (rocks + dead camels)
            - 🚗 Improved car model
            - 📱 Off-road vignette + screen shake
            - 🔔 Vibration feedback

            > **Lưu ý:** Clone repo + Android Studio để build nếu APK không tự build.
          files: |
            release_output/*.apk
          draft: false
          prerelease: false
