plugins {
    id 'com.android.application'
}

// Load keystore properties from keystore.properties file or environment variables
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    // Fallback to environment variables (for CI/CD)
    keystoreProperties['keyAlias'] = System.getenv('KEY_ALIAS') ?: ''
    keystoreProperties['keyPassword'] = System.getenv('KEY_PASSWORD') ?: ''
    keystoreProperties['storeFile'] = System.getenv('KEYSTORE_FILE') ?: ''
    keystoreProperties['storePassword'] = System.getenv('KEYSTORE_PASSWORD') ?: ''
}

android {
    namespace 'com.samacaogiac.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.samacaogiac.game"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "0.5"
    }

    signingConfigs {
        release {
            if (keystoreProperties['storeFile']) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // FIX: removed viewBinding (not used) to reduce build overhead
    buildFeatures {
        viewBinding false
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.core:core:1.12.0'
}
