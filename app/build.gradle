plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Load keystore properties from keystore.properties file or environment variables
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    // Fallback to environment variables (for CI/CD)
    keystoreProperties['keyAlias'] = System.getenv('KEY_ALIAS') ?: ''
    keystoreProperties['keyPassword'] = System.getenv('KEY_PASSWORD') ?: ''
    keystoreProperties['storeFile'] = System.getenv('KEYSTORE_FILE') ?: ''
    keystoreProperties['storePassword'] = System.getenv('KEYSTORE_PASSWORD') ?: ''
}

android {
    namespace 'com.samacaogiac.game'
    compileSdk 34
    // v0.6: explicit NDK version — LTS r26d
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.samacaogiac.game"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "0.6"

        // v0.6: ABIs — arm64-v8a (modern), armeabi-v7a (legacy 32-bit),
        // x86_64 (emulator). Skip x86 (32-bit) — not used in production.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        // v0.6: externalNativeBuild — CMake for the C/C++ audio mixer
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++11 -fexceptions -frtti'
                cFlags '-std=c99'
                arguments '-DANDROID_STL=c++_static'
            }
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // v0.6: CMake build file
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        release {
            if (keystoreProperties['storeFile']) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                // v0.6: enable v2 + v3 signing schemes (helps avoid the
                // "this app may be harmful" Play Protect warning by
                // ensuring a modern, verifiable signature).
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            // v0.6: explicitly mark release as non-debuggable
            debuggable false
            // v0.6: native lib strips on release
            packagingOptions {
                jniLibs {
                    useLegacyPackaging false
                }
            }
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // v0.6: Kotlin JVM target
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding false
        buildConfig true
    }

    // v0.6: lint baseline — known lint issues we accept
    lint {
        abortOnError false
        checkReleaseBuilds false
        disable 'MissingTranslation'
    }

    // v0.6: bundle native libraries per-ABI to reduce APK size
    bundle {
        abi {
            enableSplit = true
        }
    }
}

configurations.all {
    resolutionStrategy {
        // v0.6: force Kotlin 1.9.22 to match Kotlin plugin version
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.core:core-ktx:1.12.0'

    // v0.6: Kotlin stdlib
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'

    // v0.6: LuaJ — pure-Java Lua 5.1 VM for game-event scripting
    implementation 'org.luaj:luaj-jse:3.0.1'
}
